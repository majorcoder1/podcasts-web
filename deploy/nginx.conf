# nginx + certbot alternative to the Caddyfile.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/podcast.4thpeople.live
#   sudo ln -s /etc/nginx/sites-available/podcast.4thpeople.live /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d podcast.4thpeople.live
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name podcast.4thpeople.live;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name podcast.4thpeople.live;

    # certbot fills these in.
    # ssl_certificate     /etc/letsencrypt/live/podcast.4thpeople.live/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/podcast.4thpeople.live/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # An episode download is a single large response; do not buffer it to disk.
    proxy_buffering off;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
